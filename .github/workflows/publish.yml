name: Publish Extension

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # OIDC trusted publishing to npm: `id-token: write` lets pnpm mint a
    # short-lived OIDC token and exchange it for a publish credential — no
    # long-lived NPM_TOKEN secret. `contents: read` is needed for checkout
    # once an explicit permissions block narrows the default GITHUB_TOKEN.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          # Must be 11+: the build-script allowlist lives in pnpm-workspace.yaml
          # (`allowBuilds`) since pnpm 11 stopped reading the `pnpm` field in
          # package.json. On pnpm 10 esbuild's postinstall never runs and the
          # Build step fails on a missing platform binary.
          version: 11

      # NOTE: no `registry-url` here on purpose. setup-node's registry-url
      # writes an `_authToken=${NODE_AUTH_TOKEN}` line into .npmrc; with no
      # token that empty entry can stop pnpm from falling back to OIDC
      # trusted publishing. Default registry (registry.npmjs.org) is used.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc -b)
        run: pnpm lint

      - name: Test @shapeitup/mcp-server
        run: pnpm --filter @shapeitup/mcp-server exec vitest run

      - name: Test @shapeitup/core
        run: pnpm --filter @shapeitup/core exec vitest run

      - name: Test shapeitup-vscode (extension)
        run: pnpm --filter shapeitup-vscode exec vitest run

      - name: Build
        run: pnpm build

      - name: Verify release tag matches package.json version
        # Only runs for GitHub `release` events (workflow_dispatch has no tag).
        # Strips a leading `v` from the tag (e.g. v1.5.0 -> 1.5.0) and compares
        # against packages/mcp-server/package.json .version. Fails loudly on
        # mismatch so we never publish a server labelled with the wrong tag.
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/mcp-server/package.json').version")"
          echo "Git tag (stripped): $TAG"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' (-> '$TAG') does not match packages/mcp-server/package.json version '$PKG_VERSION'." >&2
            exit 1
          fi

      - name: Tarball smoke test
        # Belt and suspenders: even though CI runs this on every PR/push, the
        # final release build could differ (clean install, git state, etc.)
        # so we re-verify the exact tarball we are about to publish.
        shell: bash
        run: |
          set -euo pipefail

          cd packages/mcp-server
          pnpm pack
          TGZ="$(ls shapeitup-mcp-server-*.tgz | head -n1)"
          if [ -z "$TGZ" ]; then
            echo "pnpm pack produced no tarball" >&2
            exit 1
          fi
          TGZ_ABS="$(pwd)/$TGZ"
          cd "$GITHUB_WORKSPACE"

          TMPDIR="$(mktemp -d)"
          echo "Smoke-installing $TGZ_ABS into $TMPDIR"
          pushd "$TMPDIR" >/dev/null

          npm init -y >/dev/null
          npm install "$TGZ_ABS"

          # Pipe a single MCP initialize request into the installed server,
          # then close stdin. The server listens for stdin EOF and exits
          # cleanly (rc=0) after stopping its subscriber-bus WebSocket.
          # A wrapping `timeout 15` is a belt-and-suspenders hang guard.
          INIT_REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"publish-smoke","version":"0"}}}'
          set +e
          OUT="$(echo "$INIT_REQ" | timeout 15 node node_modules/@shapeitup/mcp-server/dist/index.js 2>&1)"
          RC=$?
          set -e

          echo "--- server output ---"
          echo "$OUT"
          echo "--- end output ---"

          if [ $RC -ne 0 ]; then
            echo "Smoke test FAILED: mcp-server exited with code $RC" >&2
            exit $RC
          fi
          echo "$OUT" | grep -q '"serverInfo"'
          echo "$OUT" | grep -q '"protocolVersion"'
          echo "Smoke test OK: serverInfo + protocolVersion found, clean exit."

          popd >/dev/null
          rm -rf "$TMPDIR"
          # Leave the tarball in place in case later steps want it; the runner
          # is ephemeral anyway.

      - name: Dereference WASM symlinks for VSIX packaging
        # pnpm's install places runtime deps in packages/extension/node_modules
        # as symlinks into the pnpm store. vsce's VSIX packager does not
        # follow symlinks cleanly on all runners, so replace each symlink
        # with a real copy. Covers esbuild-wasm (runtime .shape.ts bundling)
        # and @resvg/resvg-wasm (headless SVG→PNG for render_preview).
        run: |
          cd packages/extension/node_modules
          for pkg in esbuild-wasm; do
            if [ -L "$pkg" ]; then
              target=$(readlink -f "$pkg")
              rm "$pkg"
              cp -r "$target" "$pkg"
            fi
          done
          # Scoped package: resolve the symlink at @resvg/resvg-wasm.
          if [ -L "@resvg/resvg-wasm" ]; then
            target=$(readlink -f "@resvg/resvg-wasm")
            rm "@resvg/resvg-wasm"
            mkdir -p "@resvg"
            cp -r "$target" "@resvg/resvg-wasm"
          fi

      - name: Publish @shapeitup/mcp-server to npm
        # Publishes the standalone server so `npx -y @shapeitup/mcp-server`
        # works for every MCP client without the VS Code extension installed.
        #
        # Auth is via OIDC trusted publishing (configured on npmjs.com for this
        # package + the asbis/ShapeItUp `publish.yml` workflow) — no token env.
        # OIDC trusted publishing is an npm-CLI feature (npm >= 11.5.1); pnpm
        # does NOT perform the OIDC token exchange, so we publish with `npm`.
        #
        # We publish the tarball that `pnpm pack` produced in the smoke-test
        # step above: pnpm rewrites the `workspace:*` devDeps to real versions,
        # so the manifest is registry-valid (a bare `npm publish` from the dir
        # would choke on `workspace:`). `npm install -g npm@latest` guarantees
        # an OIDC-capable npm on the Node 22 runner (ships npm 10.x).
        #
        # NOTE: no `continue-on-error` here — a failed npm publish MUST abort
        # the workflow so the `marketplace` job never ships a VSIX referencing
        # a server version that wasn't actually released.
        #
        # But "already on the registry" is not a failure, it is the goal state.
        # Treating it as one is how v1.24.0 and v1.27.0 both ended with npm
        # published and the Marketplace step never reached: the Marketplace PAT
        # (since replaced by Entra ID) had expired, and re-running afterwards
        # died here on a version that had succeeded the first time. The two channels have to be able to fail
        # independently, or one broken credential silently strands the other.
        run: |
          set -euo pipefail
          npm install -g npm@latest
          echo "npm version: $(npm --version)"
          cd packages/mcp-server
          TGZ="$(ls shapeitup-mcp-server-*.tgz | head -n1)"
          if [ -z "$TGZ" ]; then
            echo "::error::no pnpm-pack tarball found in packages/mcp-server" >&2
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@shapeitup/mcp-server@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@shapeitup/mcp-server@$PKG_VERSION is already published — skipping."
            echo "This step is idempotent so a re-run can reach the Marketplace step."
          else
            echo "Publishing $TGZ via OIDC trusted publishing"
            npm publish "$TGZ" --access public
          fi

      - name: Package the VSIX
        # Packaged here, published by the `marketplace` job below. The split is
        # about credentials: that job runs in the `marketplace` environment,
        # which is what the Entra ID federated credential trusts. Keeping THIS
        # job out of any environment leaves the OIDC claims that npm's trusted
        # publisher checks exactly as they were.
        run: cd packages/extension && npx -y @vscode/vsce package --out "$GITHUB_WORKSPACE/shapeitup-vscode.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: shapeitup-vscode.vsix
          if-no-files-found: error

  marketplace:
    needs: publish
    runs-on: ubuntu-latest
    # Auth is Microsoft Entra ID, not a PAT. Azure DevOps PATs expire (a year
    # by default), and when one lapsed the listing sat at 1.23.0 for six
    # releases; global PATs are retired outright on 2026-12-01. Here GitHub's
    # OIDC token is exchanged for an Entra token for the app registration
    # "ShapeItUp Marketplace publisher (GitHub Actions)" in the Standardmappe
    # tenant. Its federated credential trusts exactly this subject:
    #   repo:asbis/ShapeItUp:environment:marketplace
    # Rename the environment and the sign-in fails with AADSTS700213.
    environment: marketplace
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sign in to Microsoft Entra ID
        # The app has no Azure subscription, only a seat on the Marketplace
        # publisher, hence allow-no-subscriptions. The IDs are environment
        # variables, not secrets: they identify the app, they don't unlock it.
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Show the identity the Marketplace sees
        # This ID (not the app's client ID) is what the publisher's Members
        # list takes: marketplace.visualstudio.com/manage/publishers/shapeitup,
        # role Contributor. Printed on every run so a lost membership is a
        # copy-paste away from fixed.
        continue-on-error: true
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query "{id: id, displayName: displayName}" -o json

      - name: Check publish rights
        # Fails before any upload, with a message that names the problem.
        run: npx -y @vscode/vsce verify-pat --azure-credential shapeitup

      - name: Publish to VS Marketplace
        # --skip-duplicate for the same reason the npm step skips: a version
        # that is already listed is the goal state, so a re-run must pass.
        run: npx -y @vscode/vsce publish --packagePath shapeitup-vscode.vsix --azure-credential --skip-duplicate
